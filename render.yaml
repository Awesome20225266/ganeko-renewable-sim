# Render.com Blueprint — FastAPI app (API + dashboard + in-process scheduler) on Render,
# with the database on Supabase (managed Postgres).
#
# Deploy: New + → Blueprint → connect this repo → Apply. Render will prompt for the
# DATABASE_URL (paste your Supabase connection string — see DEPLOYMENT.md §Supabase).
#
# Free-tier note: a free web service would normally sleep after ~15 min idle. We keep it
# awake with KEEPALIVE_ENABLED=true — the in-process scheduler self-pings /health every
# 10 min (via the auto-injected RENDER_EXTERNAL_URL), which resets Render's idle timer and
# keeps the scheduler running so shared API keys always get fast, fresh (<=15 min) data.
# For a hard always-on guarantee, use a paid plan and add a `type: worker` service running
# `bash scripts/entrypoint.sh scheduler` (same DATABASE_URL).
services:
  - type: web
    name: renewable-sim
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/entrypoint.sh api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # paste your Supabase pooler URL (incl. ?sslmode=require)
        sync: false
      - key: ADMIN_BOOTSTRAP_KEY   # auto-generated strong admin key
        generateValue: true
      - key: SCHEDULER_ENABLED     # in-process scheduler (free single service)
        value: "true"
      - key: DASHBOARD_CONSOLE_WRITE  # keyless console; set false to lock down public access
        value: "true"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: PLANT_CODE
        value: HYBRID01
      - key: PLANT_NAME
        value: Ganeko Two Energy Private Limited
      - key: PLANT_LAT
        value: "17.60"
      - key: PLANT_LON
        value: "76.36"
      - key: PLANT_TZ
        value: Asia/Kolkata
      - key: LIVE_REFRESH_MINUTES
        value: "15"
      # The day-ahead schedule publishes at SCHEDULER_DAILY_TIME (00:30 IST = 19:00 UTC),
      # a hard deadline. Open-Meteo's free quota is shared across Render's egress IP and
      # is reliably exhausted from ~07:00 UTC until it resets at 00:00 UTC, so the
      # forecast horizon is fetched in its own job just after the reset instead.
      - key: FORECAST_PREFETCH_ENABLED
        value: "true"
      - key: FORECAST_PREFETCH_START_HOUR_UTC   # 01:00 UTC = 06:30 IST
        value: "1"
      - key: FORECAST_PREFETCH_END_HOUR_UTC     # hourly retries through 06:00 UTC
        value: "6"
      - key: SCHEDULE_MAX_ANCHOR_AGE_HOURS      # refuse a stale day-ahead anchor
        value: "36"
      - key: SCHEDULE_RETRY_ENABLED             # hourly: issue missing + revise future
        value: "true"
      # Publication invariants. Pinned here rather than left to the code defaults so the
      # deployed values are visible and auditable in the blueprint.
      #
      # The instant the immutability rules switch on: from here a published ACTUAL is
      # never recalculated (an admin reprocess stores a separate diagnostic instead of
      # replacing it), and a SCHEDULE is only revised beyond its operational lock window.
      # QUOTED deliberately: an unquoted ISO-8601 timestamp is parsed by YAML as a
      # timestamp type, not a string.
      - key: GENERATION_IMMUTABILITY_CUTOVER
        value: "2026-08-25T15:00:00+05:30"     # 15:00 IST = 09:30 UTC
      # Automatic intraday schedule revision by the hourly pass. Costs zero provider
      # calls — it reads stored generation/weather and recomputes P90 in process.
      - key: SCHEDULE_INTRADAY_REVISION_ENABLED
        value: "true"
      # Operational lock-in: while operating inside block X, the schedule for this many
      # minutes ahead is committed dispatch. 120 min on the 15-min grid protects X plus
      # the next 8 blocks, so the first revisable block is X+9.
      - key: SCHEDULE_REVISION_LOCK_MINUTES
        value: "120"
      - key: KEEPALIVE_ENABLED      # self-ping /health to prevent free-tier idle spin-down
        value: "true"
      # KEEPALIVE_URL left unset → falls back to Render's auto-injected RENDER_EXTERNAL_URL
